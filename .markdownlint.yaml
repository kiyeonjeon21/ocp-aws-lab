# markdownlint-cli2 설정.
#
#   npx markdownlint-cli2 "**/*.md"
#
# 두 규칙만 끕니다. 나머지는 전부 켜져 있으니 새 문서도 통과시켜야 합니다.

default: true

# MD013 (줄 길이)
# 이 레포는 "한 문장은 한 줄에" 규칙을 씁니다.
# 그래야 문장 단위로 diff 가 잡히고 리뷰가 됩니다.
# 물리적 줄 길이 제한과는 양립하지 않으므로 끕니다.
MD013: false

# MD033 (인라인 HTML)
# 트러블슈팅 절이 <details>/<summary> 로 접혀 있습니다.
# GitHub 에서 접히는 블록은 마크다운 문법으로 표현할 방법이 없습니다.
MD033: false

# MD010 (하드 탭) - 코드 블록 안에서만 허용
# docs/runlog/ 는 runlog.sh 가 감싼 명령의 출력을 그대로 담습니다.
# du, ls, oc 같은 명령이 탭으로 컬럼을 맞춰 내보내는데, 그걸 스페이스로 바꾸면
# 기록이 "그때 화면"이 아니게 됩니다. 기록의 가치는 각색하지 않는 데 있습니다.
# 본문(산문)에 탭이 들어가는 것은 계속 막습니다.
MD010:
  code_blocks: false
